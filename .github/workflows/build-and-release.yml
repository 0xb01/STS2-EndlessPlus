name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag Override (e.g. v1.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Mod
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve Game Dependencies
        id: deps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "lib" | Out-Null

          # If secret base64 payload is provided, restore dependencies to lib/
          if ("$env:STS2_LIBS_BASE64") {
            Write-Host "Restoring dependencies from STS2_LIBS_BASE64 secret..."
            $bytes = [Convert]::FromBase64String("$env:STS2_LIBS_BASE64")
            $zipPath = "lib/deps.zip"
            [IO.File]::WriteAllBytes($zipPath, $bytes)
            Expand-Archive -Path $zipPath -DestinationPath "lib" -Force
            Remove-Item $zipPath -Force
          }

          # Check if required assemblies exist in lib/
          $required = @("GodotSharp.dll", "sts2.dll", "0Harmony.dll", "BaseLib.dll")
          $missing = @()
          foreach ($dll in $required) {
            if (-not (Test-Path "lib/$dll")) {
              $missing += $dll
            }
          }

          $isRelease = ("${{ github.ref_type }}" -eq "tag") -or ("${{ inputs.create_release }}" -eq "true")

          if ($missing.Count -eq 0) {
            Write-Host "All game dependencies resolved in lib/."
            "has_deps=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ($isRelease) {
            Write-Error "Cannot build release: missing required game dependencies in lib/: $($missing -join ', '). Add STS2_LIBS_BASE64 repository secret or build release locally."
            exit 1
          } else {
            Write-Warning "Game dependencies not found in lib/ ($($missing -join ', ')). CI build skipped for this commit."
            "has_deps=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "### ⚠️ CI Build Notice`n`nGame dependencies not present in runner environment. Build skipped.`nTo enable automated compilation in GitHub Actions, configure the `STS2_LIBS_BASE64` repository secret." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
        env:
          STS2_LIBS_BASE64: ${{ secrets.STS2_LIBS_BASE64 }}

      - name: Extract Mod Version
        if: steps.deps.outputs.has_deps == 'true'
        id: version
        shell: pwsh
        run: |
          $json = Get-Content -Raw "BNKZ.STS2.EndlessPlus.json" | ConvertFrom-Json
          $ver = $json.version
          if ("${{ github.event_name }}" -eq "release") {
            $ver = "${{ github.event.release.tag_name }}".TrimStart('v')
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          } elseif ("${{ inputs.tag_name }}" -ne "") {
            $ver = "${{ inputs.tag_name }}".TrimStart('v')
          }
          Write-Host "Target Version: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Solution
        if: steps.deps.outputs.has_deps == 'true'
        run: dotnet build BNKZ.STS2.EndlessPlus.csproj -c Release -p:STS2_PATH="lib"

      - name: Stage Distribution Package
        if: steps.deps.outputs.has_deps == 'true'
        id: package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $distDir = "staging/EndlessPlus"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          Copy-Item "bin/Release/BNKZ.STS2.EndlessPlus.dll" -Destination $distDir
          Copy-Item "BNKZ.STS2.EndlessPlus.json" -Destination $distDir
          Copy-Item "BNKZ.STS2.EndlessPlus.config" -Destination $distDir
          Copy-Item "README.md" -Destination $distDir
          if (Test-Path "docs") {
            Copy-Item "docs" -Destination $distDir -Recurse
          }
          if (Test-Path "bin/Release/BNKZ.STS2.EndlessPlus.xml") {
            Copy-Item "bin/Release/BNKZ.STS2.EndlessPlus.xml" -Destination $distDir
          }

          $zipName = "STS2-EndlessPlus_v$ver.zip"
          Compress-Archive -Path "staging/EndlessPlus" -DestinationPath $zipName -Force
          Write-Host "Created archive: $zipName"
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Build Artifact
        if: steps.deps.outputs.has_deps == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: STS2-EndlessPlus_v${{ steps.version.outputs.VERSION }}
          path: staging/EndlessPlus

      - name: Create GitHub Release
        if: steps.deps.outputs.has_deps == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) || github.event_name == 'release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.VERSION)) }}
          name: EndlessPlus v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: STS2-EndlessPlus_v*.zip
